<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Графики</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #fafafa;
        }

        h1 {
            text-align: center;
            margin-bottom: 24px;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .chart-cell {
            min-width: 0;
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            padding: 8px;
            box-sizing: border-box;
        }

        .chart-title {
            display: block;
            padding: 10px 12px 6px;
            font-size: 1.05rem;
            font-weight: 600;
            color: #24292e;
            text-decoration: none;
            border-bottom: 1px solid #f0f0f0;
            margin-bottom: 4px;
            transition: color 0.15s ease;
        }

        .chart-title:hover {
            color: #0969da;
            text-decoration: underline;
        }

        .chart-title::after {
            content: " ↗";
            font-size: 0.85em;
            color: #999;
        }

        @media (max-width: 900px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <h1>Графики</h1>

    <div class="charts-grid">
