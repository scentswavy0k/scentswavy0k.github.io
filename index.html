<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя страница</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #fafafa;
        }

        h1 {
            text-align: center;
            margin-bottom: 24px;
        }

        /* Сетка 2×2 */
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;   /* две равные колонки */
            gap: 20px;                        /* отступы между графиками */
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Каждая ячейка сетки */
        .chart-cell {
            min-width: 0;   /* важно: не даёт содержимому раздувать ячейку */
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            padding: 8px;
            box-sizing: border-box;
        }

        /* Принудительно выравниваем высоту всех обёрток Datawrapper.
           !important нужен, чтобы перебить инлайновый style="min-height:..." */
        .chart-cell > div {
            min-height: 455px !important;
        }

        /* На узких экранах — одна колонка */
        @media (max-width: 900px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <h1>Моя страница</h1>

    <div class="charts-grid">

        <!-- ЛитРес — слева сверху -->
        <div class="chart-cell">
<iframe title="ЛитРес" aria-label="Line chart" id="datawrapper-chart-AjllV" src="https://datawrapper.dwcdn.net/AjllV/6/" scrolling="no" frameborder="0" style="width: 0; min-width: 100% !important; border: none;" height="455" data-external="1"></iframe><script type="text/javascript">(function(){function e(){window.addEventListener(`message`,function(e){if(e.data[`datawrapper-height`]!==void 0){var t=document.querySelectorAll(`iframe`);for(var n in e.data[`datawrapper-height`])for(var r=0,i;i=t[r];r++)if(i.contentWindow===e.source){var a=e.data[`datawrapper-height`][n]+`px`;i.style.height=a}}})}e()})();</script>
                    </div>

        <!-- LiveLib — справа сверху -->
        <div class="chart-cell">
            <div style="min-height:441px" id="datawrapper-vis-4FP5p"><script type="text/javascript" defer src="https://datawrapper.dwcdn.net/4FP5p/embed.js" charset="utf-8" data-target="#datawrapper-vis-4FP5p"></script><noscript><img src="https://datawrapper.dwcdn.net/4FP5p/full.png" alt="LiveLib (Line chart)" /></noscript></div>
        </div>

        <!-- BookMix — слева снизу -->
        <div class="chart-cell">
            <div style="min-height:453px" id="datawrapper-vis-iyDgt"><script type="text/javascript" defer src="https://datawrapper.dwcdn.net/iyDgt/embed.js" charset="utf-8" data-target="#datawrapper-vis-iyDgt"></script><noscript><img src="https://datawrapper.dwcdn.net/iyDgt/full.png" alt="BookMix (Line chart)" /></noscript></div>
        </div>

        <!-- MyBook — справа снизу -->
        <div class="chart-cell">
            <div style="min-height:442px" id="datawrapper-vis-EgHYE"><script type="text/javascript" defer src="https://datawrapper.dwcdn.net/EgHYE/embed.js" charset="utf-8" data-target="#datawrapper-vis-EgHYE"></script><noscript><img src="https://datawrapper.dwcdn.net/EgHYE/full.png" alt="MyBook (Line chart)" /></noscript></div>
        </div>

    </div>

</body>
</html>
